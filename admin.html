<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SURPLUSSTORE - Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#f5f5f5;color:#0a0a0a;}

/* LOGIN */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0a0a0a;}
.login-box{background:#fff;border-radius:12px;padding:40px 32px;width:100%;max-width:380px;}
.login-logo{width:56px;height:56px;border-radius:50%;object-fit:cover;margin-bottom:20px;}
.login-title{font-size:24px;font-weight:800;margin-bottom:4px;}
.login-sub{font-size:13px;color:#888;margin-bottom:28px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#888;margin-bottom:8px;font-weight:600;}
.field input,.field textarea,.field select{width:100%;background:#f5f5f5;border:1.5px solid #e8e8e8;color:#0a0a0a;padding:12px 14px;font-family:'Inter',sans-serif;font-size:14px;outline:none;border-radius:8px;transition:border-color 0.2s;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#0a0a0a;background:#fff;}
.field textarea{min-height:80px;resize:vertical;}
.field select option{background:#fff;}
.login-btn{width:100%;background:#0a0a0a;color:#fff;border:none;padding:14px;font-size:15px;font-weight:700;border-radius:8px;cursor:pointer;margin-top:4px;transition:background 0.2s;}
.login-btn:hover{background:#333;}
.err{color:#e53935;font-size:13px;margin-top:10px;display:none;text-align:center;}

/* DASHBOARD */
#dashboard{display:none;}
nav{background:#0a0a0a;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.nav-left{display:flex;align-items:center;gap:12px;}
.nav-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;}
.nav-title{color:#fff;font-size:16px;font-weight:700;}
.nav-badge{background:#333;color:#aaa;font-size:11px;padding:3px 8px;border-radius:4px;margin-left:4px;}
.logout-btn{background:transparent;color:#888;border:1px solid #333;padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;border-radius:6px;transition:all 0.2s;}
.logout-btn:hover{color:#fff;border-color:#666;}

.main{max-width:700px;margin:0 auto;padding:24px;}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr);}}
.stat{background:#fff;border-radius:10px;padding:16px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.stat-n{font-size:32px;font-weight:900;line-height:1;}
.stat-l{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#888;margin-top:4px;}

/* ADD FORM */
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.card-title{font-size:17px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:480px){.row2{grid-template-columns:1fr;}}
.save-btn{background:#0a0a0a;color:#fff;border:none;padding:13px 28px;font-size:14px;font-weight:700;border-radius:8px;cursor:pointer;margin-top:8px;transition:background 0.2s;}
.save-btn:hover{background:#333;}
.img-prev{width:80px;height:80px;object-fit:cover;border-radius:8px;margin-top:10px;display:none;border:2px solid #eee;}

/* PRODUCT LIST */
.prod-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #f0f0f0;flex-wrap:wrap;}
.prod-row:last-child{border-bottom:none;}
.prod-thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;background:#f0f0f0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;}
.prod-info{flex:1;min-width:100px;}
.prod-name{font-size:14px;font-weight:700;margin-bottom:2px;}
.prod-meta{font-size:12px;color:#888;}
.prod-price{font-size:16px;font-weight:800;margin-right:8px;}
.stock-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;}
.dot-in{background:#25d366;}
.dot-limited{background:#ffa500;}
.dot-out{background:#e53935;}
.del-btn{background:transparent;color:#e53935;border:1.5px solid #e53935;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;border-radius:6px;transition:all 0.2s;white-space:nowrap;}
.del-btn:hover{background:#e53935;color:#fff;}
.empty-list{text-align:center;padding:40px;color:#aaa;}
.empty-list p{font-size:14px;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0a0a0a;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;}
.toast.show{opacity:1;}

    /* EDIT MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
    .modal-overlay.open{display:flex;}
    .modal-box{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
    .modal-title{font-size:18px;font-weight:800;margin-bottom:20px;}
    .edit-btn{background:transparent;color:#0a0a0a;border:1.5px solid #0a0a0a;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;border-radius:6px;transition:all 0.2s;}
    .edit-btn:hover{background:#0a0a0a;color:#fff;}
    .stock-select{background:#f5f5f5;border:1.5px solid #e0e0e0;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;outline:none;}
</style>
</head>

  <div class="main">
    <!-- STATS -->
    <div class="stats" id="stats"></div>

    <!-- ADD PRODUCT -->
    <div class="card">
      <div class="card-title">&#43; Add New Product</div>
      <div class="row2">
        <div class="field"><label>Product Name</label><input type="text" id="pn" placeholder="e.g. Black Oversized Tee"/></div>
        <div class="field"><label>Price (&#8377;)</label><input type="number" id="pp" placeholder="e.g. 499"/></div>
      </div>
      <div class="field"><label>Description</label><textarea id="pd" placeholder="Describe the product..."></textarea></div>
      <div class="row2">
        <div class="field"><label>Sizes (comma separated)</label><input type="text" id="ps" placeholder="S, M, L, XL"/></div>
        <div class="field"><label>Stock Status</label>
          <select id="pst">
            <option value="in">&#9899; In Stock</option>
            <option value="limited">&#9899; Limited Stock</option>
            <option value="out">&#9899; Out of Stock</option>
          </select>
        </div>
      </div>
      <div class="field">
      <label>Product Image</label>
      <div style="border:2px dashed #ddd;border-radius:8px;padding:20px;text-align:center;cursor:pointer;background:#fafafa;" onclick="document.getElementById('pi').click()">
        <div id="upload-placeholder">
          <div style="font-size:28px;margin-bottom:6px;">📷</div>
          <div style="font-size:13px;color:#888;font-weight:600;">Tap to upload photo</div>
          <div style="font-size:11px;color:#bbb;margin-top:4px;">From your gallery</div>
        </div>
        <img id="pi-prev" style="width:100%;max-height:200px;object-fit:cover;border-radius:6px;display:none;"/>
      </div>
      <input type="file" id="pi" accept="image/*" style="display:none" onchange="prevImg(this)"/>
    </div>
      <button class="save-btn" onclick="addProd()">&#43; Add Product</button>
    </div>

    <!-- PRODUCT LIST -->
    <div class="card">
      <div class="card-title">&#128230; All Products</div>
      <div id="prod-list"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let products = JSON.parse(localStorage.getItem('ss_prods') || '[]');

function save() { localStorage.setItem('ss_prods', JSON.stringify(products)); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function doLogin() {
  const u = document.getElementById('au').value;
  const p = document.getElementById('ap').value;
  if (u === 'admin' && p === 'surplus123') {
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderAll();
  } else {
    document.getElementById('aerr').style.display = 'block';
  }
}

function doLogout() {
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('au').value = '';
  document.getElementById('ap').value = '';
}

function prevImg(input) {
  const prev = document.getElementById('pi-prev');
  if (input.files && input.files[0]) {
    const r = new FileReader();
    r.onload = e => { prev.src = e.target.result; prev.style.display = 'block'; };
    r.readAsDataURL(input.files[0]);
  }
}

function addProd() {
  const n = document.getElementById('pn').value.trim();
  const p = document.getElementById('pp').value.trim();
  if (!n || !p) { showToast('⚠️ Please enter name and price!'); return; }
  const prev = document.getElementById('pi-prev');
  products.unshift({
    id: Date.now(), name: n, price: parseInt(p),
    desc: document.getElementById('pd').value.trim(),
    sizes: document.getElementById('ps').value.trim(),
    stock: document.getElementById('pst').value,
    img: prev.style.display !== 'none' ? prev.src : ''
  });
  save(); renderAll();
  ['pn','pp','pd','ps'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('pst').value = 'in';
  document.getElementById('pi').value = '';
  prev.style.display = 'none'; const ph = document.getElementById('upload-placeholder'); if(ph) ph.style.display='block';
  showToast('✅ Product added successfully!');
}

function delProd(id) {
  if (!confirm('Delete this product?')) return;
  products = products.filter(p => p.id !== id);
  save(); renderAll();
  showToast('🗑️ Product deleted');
}

function stockInfo(s) {
  if (s === 'in') return ['dot-in', 'In Stock'];
  if (s === 'limited') return ['dot-limited', 'Limited Stock'];
  return ['dot-out', 'Out of Stock'];
}

function renderAll() {
  // Stats
  const t = products.length;
  const ins = products.filter(p => p.stock === 'in').length;
  const lim = products.filter(p => p.stock === 'limited').length;
  const out = products.filter(p => p.stock === 'out').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-n">${t}</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-n" style="color:#25d366">${ins}</div><div class="stat-l">In Stock</div></div>
    <div class="stat"><div class="stat-n" style="color:#ffa500">${lim}</div><div class="stat-l">Limited</div></div>
    <div class="stat"><div class="stat-n" style="color:#e53935">${out}</div><div class="stat-l">Out of Stock</div></div>`;

  // Product list
  const list = document.getElementById('prod-list');
  if (products.length === 0) {
    list.innerHTML = '<div class="empty-list"><p>No products yet. Add your first product above! 👆</p></div>';
    return;
  }
  list.innerHTML = products.map(p => {
    const [dotClass, stockText] = stockInfo(p.stock);
    return `<div class="prod-row">
      ${p.img ? `<img class="prod-thumb" src="${p.img}" style="width:52px;height:52px;object-fit:cover;border-radius:8px"/>` : `<div class="prod-thumb" style="background:#f0f0f0;border-radius:8px;"></div>`}
      <div class="prod-info">
        <div class="prod-name">${p.name}</div>
        <div class="prod-meta"><span class="stock-dot ${dotClass}"></span>${stockText} ${p.sizes ? '&nbsp;&bull;&nbsp;' + p.sizes : ''}</div>
      </div>
      <div class="prod-price">&#8377;${p.price.toLocaleString()}</div>
      <button class="del-btn" onclick="delProd(${p.id})">Delete</button>
    </div>`;
  }).join('');
}
var editingId = null;

function openEdit(id) {{
  var p = products.find(function(x){{return x.id===id;}});
  if(!p) return;
  editingId = id;
  document.getElementById('e-name').value = p.name;
  document.getElementById('e-price').value = p.price;
  document.getElementById('e-desc').value = p.desc || '';
  document.getElementById('e-sizes').value = p.sizes || '';
  document.getElementById('e-stock').value = p.stock;
  document.getElementById('edit-modal').classList.add('open');
}}

function closeEdit() {{
  document.getElementById('edit-modal').classList.remove('open');
  editingId = null;
}}

function saveEdit() {{
  var p = products.find(function(x){{return x.id===editingId;}});
  if(!p) return;
  p.name = document.getElementById('e-name').value.trim();
  p.price = parseInt(document.getElementById('e-price').value);
  p.desc = document.getElementById('e-desc').value.trim();
  p.sizes = document.getElementById('e-sizes').value.trim();
  p.stock = document.getElementById('e-stock').value;
  save();
  renderAll();
  closeEdit();
  showToast('✅ Product updated!');
}}
</script>
<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal-box">
    <div class="modal-title">&#9998; Edit Product</div>
    <div class="field"><label>Product Name</label><input type="text" id="e-name"/></div>
    <div class="field"><label>Price (&#8377;)</label><input type="number" id="e-price"/></div>
    <div class="field"><label>Description</label><textarea id="e-desc"></textarea></div>
    <div class="field"><label>Sizes</label><input type="text" id="e-sizes"/></div>
    <div class="field"><label>Stock Status</label>
      <select id="e-stock">
        <option value="in">&#9899; In Stock</option>
        <option value="limited">&#9899; Limited Stock</option>
        <option value="out">&#9899; Out of Stock</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button onclick="saveEdit()" style="flex:1;background:#0a0a0a;color:#fff;border:none;padding:12px;font-size:14px;font-weight:700;border-radius:6px;cursor:pointer;">Save Changes</button>
      <button onclick="closeEdit()" style="flex:1;background:transparent;color:#888;border:1.5px solid #ddd;padding:12px;font-size:14px;font-weight:700;border-radius:6px;cursor:pointer;">Cancel</button>
    </div>
  </div>
</div>
</body>
